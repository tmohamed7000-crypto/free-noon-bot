<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Noon Assistant</title>

<style>
body {
  font-family: Arial;
  background: #eee;
}

#chat {
  height: 400px;
  overflow-y: auto;
  padding: 10px;
  background: #ddd;
}

.msg {
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
  max-width: 60%;
}

.user {
  background: #c8f7c5;
  margin-left: auto;
}

.bot {
  background: #fff;
}

#buttons button {
  margin: 5px;
  padding: 10px;
  border: none;
  background: orange;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}
</style>
</head>

<body>

<h2>📦 Noon Assistant</h2>

<div id="chat"></div>
<div id="buttons"></div>

<input id="input" placeholder="اكتب..." />
<button onclick="send()">إرسال</button>

<script>
function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
}

async function sendMessage(message, intent = null) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ message, intent })
  });

  const data = await res.json();

  addMessage(data.reply, "bot");

  const btns = document.getElementById("buttons");
  btns.innerHTML = "";

  if (data.buttons) {
    data.buttons.forEach(b => {
      const btn = document.createElement("button");
      btn.innerText = b.text;

      btn.onclick = () => {
        addMessage(b.text, "user");
        btns.innerHTML = "";
        sendMessage(b.text, b.value);
      };

      btns.appendChild(btn);
    });
  }
}

function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  sendMessage(text);
}

// أول رسالة
sendMessage("start");
</script>

</body>
</html>
