<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Noon Assistant</title>

<style>
body { margin:0; font-family:Arial; background:#e5ddd5; }
.header { background:#FEE500; padding:15px; font-weight:bold; }
.chat { height:80vh; overflow-y:auto; padding:10px; display:flex; flex-direction:column; }
.message { max-width:70%; margin:5px; padding:10px; border-radius:10px; }
.bot { background:#fff; align-self:flex-start; }
.user { background:#dcf8c6; align-self:flex-end; text-align:right; }
.inputBox { display:flex; padding:10px; background:#fff; }
input { flex:1; padding:10px; }
button { padding:10px; background:#FEE500; border:none; }
</style>
</head>

<body>

<div class="header">🚚 Noon Assistant</div>
<div class="chat" id="chat"></div>

<div class="inputBox">
  <input id="msg" placeholder="اكتب هنا...">
  <button onclick="send()">إرسال</button>
</div>

<script>
const chat = document.getElementById("chat");

// 🧠 session id ثابت
let sessionId = localStorage.getItem("sessionId");
if (!sessionId) {
  sessionId = Math.random().toString(36);
  localStorage.setItem("sessionId", sessionId);
}

let typingDiv;

function showTyping() {
  typingDiv = document.createElement("div");
  typingDiv.className = "message bot";
  typingDiv.innerText = "يكتب...";
  chat.appendChild(typingDiv);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  if (typingDiv) typingDiv.remove();
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function getDelay(text) {
  return Math.min(3000, 800 + text.length * 20);
}

function send() {
  let msg = document.getElementById("msg").value.trim();
  if (!msg) return;

  addMessage(msg, "user");
  document.getElementById("msg").value = "";

  showTyping();

  fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      message: msg,
      sessionId: sessionId
    })
  })
  .then(res => res.json())
  .then(data => {
    const delay = getDelay(data.reply);

    setTimeout(() => {
      removeTyping();
      addMessage(data.reply, "bot");
    }, delay);
  })
  .catch(() => {
    removeTyping();
    addMessage("حصل خطأ 😅", "bot");
  });
}

// Enter
document.getElementById("msg").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
