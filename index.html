<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Noon Assistant</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
}

/* Header */
.header {
  background: #ffe600;
  padding: 15px;
  font-weight: bold;
}

/* Chat */
#chat {
  height: 80vh;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
}

/* Messages */
.msg {
  max-width: 70%;
  padding: 12px;
  margin: 5px 0;
  border-radius: 15px;
  line-height: 1.4;
}

.user {
  background: #c8f7c5;
  align-self: flex-end;
}

.bot {
  background: white;
  align-self: flex-start;
}

/* Input */
.input-area {
  display: flex;
  padding: 10px;
  background: white;
}

input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 10px;
}

button.send {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  background: #ffe600;
  cursor: pointer;
  border-radius: 10px;
}

/* Buttons */
#buttons {
  padding: 10px;
  display: flex;
  gap: 10px;
}

#buttons button {
  flex: 1;
  padding: 12px;
  border: none;
  background: #ff9800;
  color: white;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

#buttons button:hover {
  background: #e68900;
}
</style>
</head>

<body>

<div class="header">📦 Noon Assistant</div>

<div id="chat"></div>
<div id="buttons"></div>

<div class="input-area">
  <input id="input" placeholder="اكتب رسالتك..." />
  <button class="send" onclick="send()">إرسال</button>
</div>

<script>
function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

async function sendMessage(message) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ message })
  });

  const data = await res.json();

  addMessage(data.reply, "bot");
}

function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  sendMessage(text);
}

// Enter key
document.getElementById("input").addEventListener("keypress", function(e){
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
